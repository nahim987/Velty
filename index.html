<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELTY - Premium Wallpapers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Inter,sans-serif;overflow-x:hidden}
header{padding:20px;text-align:center;border-bottom:1px solid #222}
header h1{letter-spacing:4px;color:#d4af37}
#home{display:flex;flex-direction:column;gap:20px;padding:40px 20px;max-width:900px;margin:auto}
.card{border:1px solid #d4af3733;background:linear-gradient(135deg,#151515,#0a0a0a);border-radius:20px;padding:30px;text-align:center;cursor:pointer;transition:.4s;position:relative;overflow:hidden}
.card:hover{transform:scale(1.02);border-color:#d4af37;box-shadow:0 0 30px #d4af3744}
.card h2{font-size:28px;margin-bottom:10px}
.card p{color:#888}
.badge{position:absolute;top:15px;left:15px;background:#d4af37;color:#000;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
#gallery{display:none;animation:slideIn .5s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;padding:20px}
.item{border-radius:12px;overflow:hidden;background:#151515;border:1px solid #222}
.item img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
.item .pc img{aspect-ratio:16/9}
.info{padding:10px;display:flex;justify-content:space-between;align-items:center}
.info button{background:#d4af37;border:none;padding:5px 12px;border-radius:6px;font-weight:bold;cursor:pointer}
.back{margin:20px;background:transparent;border:1px solid #333;color:#fff;padding:10px 20px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header><h1>VELTY</h1><p style="color:#666;font-size:12px;letter-spacing:2px">PREMIUM COLLECTION</p></header>

<div id="home">
  <div class="card" onclick="openCat('phone')">
    <span class="badge">1.2k+ • AMOLED</span>
    <h2>📱 Phone Wallpapers</h2>
    <p>Portrait • 9:16 • 4K • OLED Black</p>
  </div>
  <div class="card" onclick="openCat('pc')">
    <span class="badge">890+ • 4K/8K</span>
    <h2>💻 PC Wallpapers</h2>
    <p>Ultrawide • 16:9 • 4K • Minimal</p>
  </div>
</div>

<div id="gallery">
  <button class="back" onclick="goHome()">← Back to Categories</button>
  <h2 id="catTitle" style="padding:0 20px"></h2>
  <div class="grid" id="grid"></div>
</div>

<script>
let items=[
  {name:"Midnight Peaks",price:80,img:"wall1.jpg",cat:"pc"},
  {name:"Black Gold",price:100,img:"wall2.jpg",cat:"phone"},
  {name:"Arctic Smoke",price:100,img:"wall3.jpg",cat:"phone"},
  // aro add korte chaile ekhane add koro
];

function openCat(c){
  document.getElementById('home').style.display='none';
  let g=document.getElementById('gallery');
  g.style.display='block';
  document.getElementById('catTitle').innerText= c=='phone' ? 'Phone Wallpapers' : 'PC Wallpapers';
  let grid=document.getElementById('grid');
  grid.innerHTML='';
  let filtered=items.filter(i=>i.cat===c);
  filtered.forEach(it=>{
    grid.innerHTML+=`<div class="item ${c}"><img src="${it.img}" loading="lazy"><div class="info"><span>${it.name}</span><button>৳${it.price}</button></div></div>`;
  });
  if(filtered.length==0) grid.innerHTML=`<p style="color:#666;padding:20px">No wallpapers in this category yet. Add ${c} wallpapers as ${c=='phone'?'wall2.jpg, wall3.jpg':'wall1.jpg'}</p>`;
}
function goHome(){
  document.getElementById('gallery').style.display='none';
  document.getElementById('home').style.display='flex';
}
</script>
</body>
</html>
