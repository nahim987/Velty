<title>VELTY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#050505;color:#fff}
header{display:flex;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #111;position:sticky;top:0;background:#050505;z-index:20}
header h1{letter-spacing:5px;font-size:18px}
.hero{padding:40px 20px 10px;max-width:1100px;margin:auto}
.hero h1{font-size:48px;font-weight:900;letter-spacing:-2px;line-height:.9;text-align:left}
.hero h1 span{color:#d4af37}
.hero p{color:#666;margin-top:12px;max-width:400px;font-size:13px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 20px;max-width:1100px;margin:auto;padding:16px 20px}
@media(min-width:700px){.grid4{grid-template-columns:repeat(4,1fr)}}
.cat{border:1px solid #1a1a1a;background:#0e0e0e;border-radius:18px;padding:20px;cursor:pointer;transition:.3s}
.cat:hover{border-color:#444;transform:translateY(-2px)}
.cat h3{font-size:14px;margin-top:10px}
.cat p{color:#555;font-size:11px;margin-top:3px}
.box{width:34px;height:34px;background:#151515;border-radius:9px;display:grid;place-items:center}
#view{max-width:1100px;margin:auto;padding:0 20px;display:none}
#view.show{display:block;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sub2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.subcard{background:#111;border:1px solid #222;border-radius:16px;padding:22px;text-align:center;cursor:pointer}
.subcard:hover{border-color:#d4af37}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.item{background:#0e0e0e;border:1px solid #1a1a1a;border-radius:14px;overflow:hidden}
.item img{width:100%;display:block}.phone img{aspect-ratio:9/16;object-fit:cover}.pc img{aspect-ratio:16/9;object-fit:cover}
.info{padding:10px;display:flex;justify-content:space-between}
.info b{font-size:12px} .info em{background:#fff;color:#000;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:800;font-style:normal}
.order{background:#0e0e0e;border:1px solid #1e1e1e;border-radius:20px;padding:22px;margin-top:16px}
.order h2{font-size:20px} .order .price{color:#d4af37;font-size:22px;font-weight:900;margin:8px 0}
.order input,.order textarea{width:100%;background:#111;border:1px solid #222;color:#fff;padding:12px;border-radius:10px;margin-top:10px;outline:none}
.order input:focus,.order textarea:focus{border-color:#d4af37}
.order button{width:100%;background:#fff;color:#000;border:none;padding:13px;border-radius:12px;font-weight:900;margin-top:12px;cursor:pointer}
.back{background:#161616;border:1px solid #222;color:#fff;padding:7px 14px;border-radius:100px;cursor:pointer;font-size:12px;margin-bottom:12px}
</style>
</head>
