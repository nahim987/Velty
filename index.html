<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELTY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;width:100vw;overflow:hidden;background:#080808;color:#fff;font-family:'Inter',sans-serif;display:flex;flex-direction:column;align-items:center;position:relative}

/* BG VELTY TEXT */
.bg-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Syne',sans-serif;font-weight:800;font-size:32vw;line-height:.8;letter-spacing:-10px;pointer-events:none;user-select:none;z-index:0;display:flex;flex-direction:column;align-items:center}
.bg-text .bw{color:#fff;mix-blend-mode:difference;opacity:.9}
.bg-text .outline{-webkit-text-stroke:1px #1a1a1a;color:transparent;margin-top:-.15em}
.bg-text .color{color:#d4af37;opacity:.15;margin-top:-.15em;font-size:.6em}

/* TOP TEXT */
.top{position:relative;z-index:2;margin-top:28px;text-align:center}
.top h1{font-family:'Syne';font-size:18px;letter-spacing:6px;font-weight:800}
.top p{font-size:11px;letter-spacing:4px;color:#888;margin-top:6px;text-transform:uppercase}

/* CENTER BOXES */
.center{position:relative;z-index:2;width:100%;max-width:360px;margin-top:32px;display:flex;flex-direction:column;gap:12px;padding:0 18px}
.box{background:rgba(18,18,18,.85);backdrop-filter:blur(20px);border:1px solid #222;border-radius:20px;padding:16px 18px;cursor:pointer;transition:.3s}
.box:hover{border-color:#333;transform:translateY(-1px)}
.box-head{display:flex;justify-content:space-between;align-items:center}
.box-head b{font-size:13px;letter-spacing:1px}
.box-head span{font-size:18px;color:#555}
.inner{display:none;margin-top:14px;border-top:1px solid #1e1e1e;padding-top:14px;gap:10px}
.box.open .inner{display:flex;flex-direction:column}
.box.open .box-head span{transform:rotate(45deg)}

.mini{display:flex;gap:10px}
.mini div{flex:1;background:#111;border:1px solid #222;border-radius:14px;padding:14px;text-align:center;font-size:12px;cursor:pointer}
.mini div:hover{background:#151515;border-color:#d4af37}
.mini div small{display:block;color:#666;margin-top:4px}

input, textarea{width:100%;background:#0e0e0e;border:1px solid #222;border-radius:12px;padding:12px;color:#fff;font-size:12px;outline:none}
textarea{resize:none;height:70px}
.order{width:100%;background:#fff;color:#000;border:none;padding:13px;border-radius:100px;font-weight:800;font-size:12px;letter-spacing:1px;cursor:pointer;margin-top:4px}
.order:hover{background:#d4af37}

.grid{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.grid img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:#111}
.grid.pc img{aspect-ratio:16/10}
.wall-item{position:relative;cursor:pointer}
.wall-item::after{content:'৳10';position:absolute;bottom:6px;right:6px;background:#fff;color:#000;font-size:10px;padding:3px 7px;border-radius:20px;font-weight:800}
.grid.pc .wall-item::after{content:'৳15'}
</style>
</head>
<body>

<div class="bg-text">
<div class="bw">VELTY</div>
<div class="outline">VELTY</div>
<div class="color">VELTY</div>
</div>

<div class="top">
<h1>VELTY</h1>
<p>Your screen Deserves better</p>
</div>

<div class="center">
<!-- 1. WALLPAPER BOX -->
<div class="box" id="wallBox">
<div class="box-head" onclick="toggle('wallBox')"><b>WALLPAPER</b><span>+</span></div>
<div class="inner">
<div class="mini">
<div onclick="showWalls('phone')">PHONE<br><small>৳10</small></div>
<div onclick="showWalls('pc')">PC<br><small>৳15</small></div>
</div>
<div class="grid" id="phoneGrid">
<div class="wall-item" onclick="buy('Phone Wall - Black Gold')"><img src="wall1.jpg" onerror="this.src='https://picsum.photos/seed/v1/300/500'"></div>
<div class="wall-item" onclick="buy('Phone Wall - Moon')"><img src="wall2.jpg" onerror="this.src='https://picsum.photos/seed/v2/300/500'"></div>
</div>
<div class="grid pc" id="pcGrid">
<div class="wall-item" onclick="buy('PC Wall - Midnight')"><img src="pc1.jpg" onerror="this.src='https://picsum.photos/seed/pc1/600/400'"></div>
<div class="wall-item" onclick="buy('PC Wall - Gold')"><img src="pc2.jpg" onerror="this.src='https://picsum.photos/seed/pc2/600/400'"></div>
</div>
</div>
</div>

<!-- 2. THUMBNAIL -->
<div class="box" id="thumbBox">
<div class="box-head" onclick="toggle('thumbBox')"><b>CREATE THUMBNAIL</b><span>+</span></div>
<div class="inner">
<input id="tName" placeholder="Your Name">
<textarea id="tDetails" placeholder="Thumbnail Details - ex: Gaming, MrBeast Style..."></textarea>
<button class="order" onclick="sendOrder('Thumbnail')">ORDER ON WHATSAPP</button>
</div>
</div>

<!-- 3. LOGO -->
<div class="box" id="logoBox">
<div class="box-head" onclick="toggle('logoBox')"><b>CREATE LOGO</b><span>+</span></div>
<div class="inner">
<input id="lName" placeholder="Brand Name">
<textarea id="lDetails" placeholder="Logo Details - ex: Minimal, Luxury..."></textarea>
<button class="order" onclick="sendOrder('Logo')">ORDER ON WHATSAPP</button>
</div>
</div>

<!-- 4. BUSINESS CARD -->
<div class="box" id="cardBox">
<div class="box-head" onclick="toggle('cardBox')"><b>CREATE BUSINESS CARD</b><span>+</span></div>
<div class="inner">
<input id="cName" placeholder="Your Name / Company">
<textarea id="cDetails" placeholder="Business Card Details..."></textarea>
<button class="order" onclick="sendOrder('Business Card')">ORDER ON WHATSAPP</button>
</div>
</div>

</div>

<script>
const WA="8801511530396";
function toggle(id){
document.getElementById(id).classList.toggle('open');
}
function showWalls(type){
document.getElementById('phoneGrid').style.display= type=='phone'?'grid':'none';
document.getElementById('pcGrid').style.display= type=='pc'?'grid':'none';
}
function buy(name){
window.open(`https://wa.me/${WA}?text=Hi Velty! I want to buy: ${name}`,'_blank');
}
function sendOrder(service){
let name='',details='';
if(service=='Thumbnail'){name=document.getElementById('tName').value;details=document.getElementById('tDetails').value}
if(service=='Logo'){name=document.getElementById('lName').value;details=document.getElementById('lDetails').value}
if(service=='Business Card'){name=document.getElementById('cName').value;details=document.getElementById('cDetails').value}
if(!name||!details){alert('Name & Details likho!');return}
let msg=`Hi Velty! I want to create ${service}%0AName: ${name}%0ADetails: ${details}`;
window.open(`https://wa.me/${WA}?text=${msg}`,'_blank');
}
</script>
</body>
</html>
