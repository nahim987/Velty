<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELTY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;width:100vw;overflow:hidden;background:#080808;color:#fff;font-family:'Inter',sans-serif;display:flex;flex-direction:column;position:relative}

/* PREMIUM AESTHETIC BG */
body::before{content:'';position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 0%, rgba(212,175,55,.15), transparent 60%), radial-gradient(40% 40% at 90% 90%, rgba(120,80,255,.12), transparent), radial-gradient(30% 30% at 10% 80%, rgba(255,255,255,.06), transparent);z-index:0}
body::after{content:'';position:absolute;inset:0;background:url('https://grainy-gradients.vercel.app/noise.svg');opacity:.04;z-index:0;pointer-events:none}

.top{position:relative;z-index:2;text-align:center;padding:38px 20px 22px}
.top h1{font-family:'Syne',sans-serif;font-weight:800;font-size:54px;letter-spacing:12px;line-height:1}
.top p{font-size:10px;letter-spacing:5px;color:#777;margin-top:10px;text-transform:uppercase}

.wrap{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;gap:12px;padding:0 16px 16px;width:100%;max-width:500px;margin:0 auto}

.box{background:rgba(16,16,16,.9);backdrop-filter:blur(24px);border:1px solid #1e1e1e;border-radius:22px;padding:20px 22px;cursor:pointer;transition:.3s;flex:1;display:flex;flex-direction:column;justify-content:center}
.box:hover{border-color:#2a2a2a;background:rgba(22,22,22,.95)}
.box b{font-size:12px;letter-spacing:2px;font-weight:600}
.box small{display:block;color:#555;margin-top:6px;font-size:10px;letter-spacing:1px}

.inner{display:none;margin-top:16px;gap:10px}
.box.open .inner{display:flex}
.opt{flex:1;background:#0e0e0e;border:1px solid #222;border-radius:14px;padding:14px;text-align:center;font-size:11px;letter-spacing:1px;cursor:pointer;transition:.2s}
.opt:hover{background:#151515;border-color:#fff;color:#fff}
.opt span{display:block;color:#666;margin-top:4px;font-size:10px}

/* input */
input,textarea{width:100%;background:#0d0d0d;border:1px solid #222;border-radius:12px;padding:12px 14px;color:#fff;font-size:12px;outline:none;margin-top:8px}
textarea{height:68px;resize:none}
.order{width:100%;background:#fff;color:#000;border:none;padding:13px;border-radius:100px;font-weight:800;font-size:11px;letter-spacing:1px;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<div class="top">
<h1>VELTY</h1>
<p>Your screen Deserves better</p>
</div>

<div class="wrap">
<div class="box" id="wallBox">
<div onclick="toggle('wallBox')"><b>WALLPAPER</b><small>CURATED 4K COLLECTION</small></div>
<div class="inner" id="wallInner">
<div class="opt" onclick="openWalls('phone')">PHONE<div style="margin-top:6px">৳10</div></div>
<div class="opt" onclick="openWalls('pc')">PC<div style="margin-top:6px">৳15</div></div>
</div>
</div>

<div class="box" id="thumbBox">
<div onclick="toggle('thumbBox')"><b>CREATE THUMBNAIL</b><small>YT / FB / CUSTOM</small></div>
<div class="inner" style="flex-direction:column">
<input id="tName" placeholder="Your Name">
<textarea id="tDetails" placeholder="Thumbnail Details..."></textarea>
<button class="order" onclick="sendOrder('Thumbnail')">ORDER ON WHATSAPP</button>
</div>
</div>

<div class="box" id="logoBox">
<div onclick="toggle('logoBox')"><b>CREATE LOGO</b><small>MINIMAL / LUXURY</small></div>
<div class="inner" style="flex-direction:column">
<input id="lName" placeholder="Brand Name">
<textarea id="lDetails" placeholder="Logo Details..."></textarea>
<button class="order" onclick="sendOrder('Logo')">ORDER ON WHATSAPP</button>
</div>
</div>

<div class="box" id="cardBox">
<div onclick="toggle('cardBox')"><b>CREATE BUSINESS CARD</b><small>PREMIUM PRINT READY</small></div>
<div class="inner" style="flex-direction:column">
<input id="cName" placeholder="Name / Company">
<textarea id="cDetails" placeholder="Business Card Details..."></textarea>
<button class="order" onclick="sendOrder('Business Card')">ORDER ON WHATSAPP</button>
</div>
</div>
</div>

<script>
const WA="8801511530396";
function toggle(id){document.getElementById(id).classList.toggle('open')}
function openWalls(type){window.location.href=`walls.html?type=${type}`}
function sendOrder(s){
let n='',d='';
if(s=='Thumbnail'){n=tName.value;d=tDetails.value}
if(s=='Logo'){n=lName.value;d=lDetails.value}
if(s=='Business Card'){n=cName.value;d=cDetails.value}
if(!n||!d){alert('Name & Details daw');return}
window.open(`https://wa.me/${WA}?text=Hi Velty! I want ${s}%0AName:${n}%0ADetails:${d}`,'_blank')
}
</script>
</body>
</html>
