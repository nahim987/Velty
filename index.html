<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELTY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#070707;color:#fff}
header{padding:15px 20px;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.hero{padding:30px 20px}
.hero h1{font-size:40px;font-weight:900;line-height:0.9}
.hero h1 span{color:#d4af37}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.card{border:1px solid #222;background:#111;border-radius:16px;padding:18px;cursor:pointer}
.card:active{background:#1a1a1a}
#view{display:none;padding:20px}
#view.show{display:block}
.btn{background:#222;color:#fff;border:1px solid #333;padding:8px 14px;border-radius:20px}
.box2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.smallBox{background:#111;border:1px solid #333;border-radius:14px;padding:18px;text-align:center;cursor:pointer}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.pic{background:#111;border:1px solid #222;border-radius:12px;padding:10px;text-align:center}
.pic img{width:100%;border-radius:8px}
.order{background:#111;border:1px solid #333;border-radius:16px;padding:18px;margin-top:15px}
.order input,.order textarea{width:100%;background:#000;border:1px solid #333;color:#fff;padding:10px;border-radius:8px;margin-top:10px}
.order button{width:100%;background:#fff;color:#000;padding:12px;border:none;border-radius:10px;font-weight:800;margin-top:12px}
</style>
</head>
<body>
<header><b>VELTY</b><span style="color:#666;font-size:12px">EST 2026</span></header>
<div class="hero"><h1>Your Screen<br><span>Deserves Better.</span></h1><p style="color:#666;margin-top:10px;font-size:13px">Click any box below</p></div>

<div class="grid">
<div class="card" onclick="openWall()"><div>🖼️</div><b>Wallpaper</b><p style="color:#666;font-size:11px">Phone / PC</p></div>
<div class="card" onclick="openPack('thumbnail')"><div>🎬</div><b>Create Thumbnail</b><p style="color:#666;font-size:11px">From 150tk</p></div>
<div class="card" onclick="openPack('logo')"><div>💎</div><b>Create Logo</b><p style="color:#666;font-size:11px">From 300tk</p></div>
<div class="card" onclick="openPack('banner')"><div>🚀</div><b>Create Banner</b><p style="color:#666;font-size:11px">From 250tk</p></div>
</div>

<div id="view">
<button class="btn" onclick="closeView()">← Back</button>
<div id="content"></div>
</div>

<script>
function openWall(){
var v=document.getElementById('view');
var c=document.getElementById('content');
v.className='show';
c.innerHTML='<div class="box2"><div class="smallBox" onclick="showP()"><div>📱</div><b>Phone</b></div><div class="smallBox" onclick="showC()"><div>💻</div><b>PC</b></div></div><div id="g" class="gal"></div>';
v.scrollIntoView();
}
function showP(){
var g=document.getElementById('g');
g.innerHTML='<div class="pic"><img src="wall2.jpg"><p>Black Gold - 100tk</p></div><div class="pic"><img src="wall3.jpg"><p>Arctic - 100tk</p></div>';
}
function showC(){
var g=document.getElementById('g');
g.innerHTML='<div class="pic"><img src="wall1.jpg"><p>Midnight Peaks - 80tk</p></div>';
}
function openPack(t){
var v=document.getElementById('view');
var c=document.getElementById('content');
v.className='show';
var price='150tk';
if(t=='logo') price='300tk';
if(t=='banner') price='250tk';
c.innerHTML='<div class="order"><h2>'+t.toUpperCase()+' - '+price+'</h2><input id="em" placeholder="Your Email"><textarea id="idea" placeholder="What kind of '+t+' you want?"></textarea><button onclick="sendWA(\''+t+'\')">Order on WhatsApp</button></div>';
v.scrollIntoView();
}
function closeView(){
document.getElementById('view').className='';
}
function sendWA(t){
var e=document.getElementById('em').value;
var i=document.getElementById('idea').value;
if(e==''||i==''){alert('Email + Idea likho');return;}
var txt='New '+t+' Order Email:'+e+' Idea:'+i;
window.open('https://wa.me/8801880000000?text='+txt,'_blank');
}
</script>
</body>
</html>
