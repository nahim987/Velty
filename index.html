<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELTY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;width:100vw;overflow:hidden;background:#080808;color:#fff;font-family:'Inter',sans-serif;position:relative}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 0%, rgba(212,175,55,.15), transparent 60%), radial-gradient(40% 40% at 90% 90%, rgba(120,80,255,.12), transparent), radial-gradient(30% 30% at 10% 80%, rgba(255,255,255,.06), transparent);z-index:0}
.top{position:relative;z-index:2;text-align:center;padding:38px 20px 22px}
.top h1{font-family:'Syne',sans-serif;font-weight:800;font-size:54px;letter-spacing:12px}
.top p{font-size:10px;letter-spacing:5px;color:#777;margin-top:10px;text-transform:uppercase}
.wrap{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;gap:12px;padding:0 16px 16px;max-width:500px;margin:0 auto;width:100%}
.box{background:rgba(16,16,16,.9);backdrop-filter:blur(24px);border:1px solid #1e1e1e;border-radius:22px;padding:20px 22px;cursor:pointer;flex:1;display:flex;flex-direction:column;justify-content:center}
.box b{font-size:12px;letter-spacing:2px}
.box small{color:#555;margin-top:6px;font-size:10px;letter-spacing:1px}
.inner{display:none;margin-top:16px;gap:10px}
.box.open .inner{display:flex}
.opt{flex:1;background:#0e0e0e;border:1px solid #222;border-radius:14px;padding:14px;text-align:center;font-size:11px;cursor:pointer}
.opt:hover{border-color:#fff}
input,textarea{width:100%;background:#0d0d0d;border:1px solid #222;border-radius:12px;padding:12px;color:#fff;font-size:12px;outline:none;margin-top:8px}
textarea{height:68px;resize:none}
.order{width:100%;background:#fff;color:#000;border:none;padding:13px;border-radius:100px;font-weight:800;font-size:11px;margin-top:10px;cursor:pointer}

/* WALLS PAGE */
#wallsPage{position:fixed;inset:0;background:#080808;z-index:20;display:none;flex-direction:column}
#wallsPage.show{display:flex}
.w-head{display:flex;justify-content:space-between;padding:22px;border-bottom:1px solid #111}
.w-head a{color:#666;text-decoration:none;font-size:11px;letter-spacing:2px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#111;overflow:auto}
.item{background:#080808;padding:8px;cursor:pointer}
.item img{width:100%;border-radius:12px;background:#111}
.item.phone img{aspect-ratio:9/16;object-fit:cover}
.item.pc img{aspect-ratio:16/9;object-fit:cover}
.row{display:flex;justify-content:space-between;padding:10px 4px;font-size:11px}
.row span{background:#fff;color:#000;padding:3px 8px;border-radius:20px;font-weight:800;font-size:10px}
</style>
</head>
<body>
<div id="mainPage" style="display:flex;flex-direction:column;height:100vh">
<div class="top"><h1>VELTY</h1><p>Your screen Deserves better</p></div>
<div class="wrap">
<div class="box" id="wallBox"><div onclick="toggle('wallBox')"><b>WALLPAPER</b><small>CURATED 4K COLLECTION</small></div><div class="inner"><div class="opt" onclick="openWalls('phone')">PHONE<br>৳10</div><div class="opt" onclick="openWalls('pc')">PC<br>৳15</div></div></div>
<div class="box" id="thumbBox"><div onclick="toggle('thumbBox')"><b>CREATE THUMBNAIL</b><small>YT / FB / CUSTOM</small></div><div class="inner" style="flex-direction:column"><input id="tName" placeholder="Your Name"><textarea id="tDetails" placeholder="Thumbnail Details..."></textarea><button class="order" onclick="sendOrder('Thumbnail')">ORDER ON WHATSAPP</button></div></div>
<div class="box" id="logoBox"><div onclick="toggle('logoBox')"><b>CREATE LOGO</b><small>MINIMAL / LUXURY</small></div><div class="inner" style="flex-direction:column"><input id="lName" placeholder="Brand Name"><textarea id="lDetails" placeholder="Logo Details..."></textarea><button class="order" onclick="sendOrder('Logo')">ORDER ON WHATSAPP</button></div></div>
<div class="box" id="cardBox"><div onclick="toggle('cardBox')"><b>CREATE BUSINESS CARD</b><small>PREMIUM PRINT READY</small></div><div class="inner" style="flex-direction:column"><input id="cName" placeholder="Name / Company"><textarea id="cDetails" placeholder="Business Card Details..."></textarea><button class="order" onclick="sendOrder('Business Card')">ORDER ON WHATSAPP</button></div></div>
</div>
</div>

<div id="wallsPage">
<div class="w-head"><a onclick="closeWalls()">← BACK</a><div id="wTitle" style="font-size:11px;letter-spacing:3px"></div><div></div></div>
<div class="grid" id="grid"></div>
</div>

<script>
const WA="8801511530396";
function toggle(id){document.getElementById(id).classList.toggle('open')}
function sendOrder(s){
let n='',d='';
if(s=='Thumbnail'){n=document.getElementById('tName').value;d=document.getElementById('tDetails').value}
if(s=='Logo'){n=document.getElementById('lName').value;d=document.getElementById('lDetails').value}
if(s=='Business Card'){n=document.getElementById('cName').value;d=document.getElementById('cDetails').value}
if(!n||!d){alert('Name & Details daw');return}
window.open(`https://wa.me/${WA}?text=Hi Velty! I want ${s}%0AName:${n}%0ADetails:${d}`,'_blank')
}
function openWalls(type){
document.getElementById('wallsPage').classList.add('show');
document.getElementById('wTitle').innerText=type.toUpperCase()+' WALLS';
const price=type=='phone'?'৳10':'৳15';
const walls=type=='phone'?[
{name:'Black Gold',img:'wall1.jpg'},
{name:'Mind Business',img:'wall2.jpg'},
{name:'Marble',img:'wall3.jpg'},
{name:'Moon',img:'wall4.jpg'}
]:[
{name:'Midnight Peaks',img:'pc1.jpg'},
{name:'Golden Hour',img:'pc2.jpg'},
{name:'Neon City',img:'pc3.jpg'}
];
document.getElementById('grid').innerHTML=walls.map(w=>`
<div class="item ${type}" onclick="buy('${w.name}','${type}','${price}')">
<img src="${w.img}" onerror="this.src='https://picsum.photos/seed/${w.name}/500/800'">
<div class="row"><b>${w.name}</b><span>${price}</span></div>
</div>`).join('');
}
function closeWalls(){document.getElementById('wallsPage').classList.remove('show')}
function buy(n,t,p){window.open(`https://wa.me/${WA}?text=I want to buy ${n} (${t}) ${p}`,'_blank')}
</script>
</body>
</html>
